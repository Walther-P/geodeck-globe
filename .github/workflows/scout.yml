# Temporary: probes candidate data sources from a network that can reach them.
name: Scout sources
on:
  push:
    branches: [claude/camera-scout]
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir /tmp/s && cp scripts/scout.mjs /tmp/s/ && cd /tmp/s && npm init -y >/dev/null && npm i @mapbox/vector-tile@2 pbf@4 >/dev/null 2>&1
          echo '{"type":"module"}' > package.json && node scout.mjs
