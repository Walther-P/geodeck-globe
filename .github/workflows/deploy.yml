# Builds, tests and (when Cloudflare credentials exist) deploys GeoDeck Globe
# to the `geodeck-globe` Worker. Runs on every push to main, by hand, and daily
# so the bundled satellite snapshot stays fresh.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the workers.dev subdomain
# Optional, only for the live data probe (never bundled into the site):
#   PROBE_TDX_ID, PROBE_TDX_SECRET, PROBE_CWA_KEY
# Optional, bundled into the page for everyone's Google place search:
#   GOOGLE_MAPS_KEY  (a browser key restricted to this site's URL)
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test
      - name: Build
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        # The Google key ships in the page, so only a browser API key (AIza…,
        # restricted to this site's URL) may go in; anything else pasted into
        # the secret, such as a URL signing secret, must never be published.
        run: |
          key="$(printf '%s' "$GOOGLE_MAPS_KEY" | tr -d '[:space:]')"
          if [[ "$key" =~ ^AIza[0-9A-Za-z_-]{35}$ ]]; then
            export VITE_GOOGLE_MAPS_KEY="$key"
          elif [ -n "$key" ]; then
            echo "::warning title=GOOGLE_MAPS_KEY::Not a Google API key (it should start with AIza and be 39 characters). It was left out of the site; Google maps stay off."
          fi
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Opens the built app at phone size with every feed faked and fails the
      # run if a lens reports an error, the location beam or shared links break.
      - name: App smoke test
        run: npm run screenshots
      - name: Bundle satellite snapshot
        run: node scripts/fetch-tle.mjs
      - name: Check Cloudflare credentials
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; built and tested only, not deployed."
          fi
      - name: Deploy Worker
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://geodeck-globe\.[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Live data probe (local Worker)
        continue-on-error: true
        env:
          PROBE_TDX_ID: ${{ secrets.PROBE_TDX_ID }}
          PROBE_TDX_SECRET: ${{ secrets.PROBE_TDX_SECRET }}
          PROBE_CWA_KEY: ${{ secrets.PROBE_CWA_KEY }}
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1 && break; sleep 1; done
          TEST_URL=http://localhost:8787/ node scripts/live-probe.mjs
      - name: Live data probe (deployed)
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        env:
          TEST_URL: ${{ steps.deploy.outputs.url }}/
          PROBE_TDX_ID: ${{ secrets.PROBE_TDX_ID }}
          PROBE_TDX_SECRET: ${{ secrets.PROBE_TDX_SECRET }}
          PROBE_CWA_KEY: ${{ secrets.PROBE_CWA_KEY }}
          # The site's own browser key (already public in the bundle); only the deployed origin is allowed to use it.
          PROBE_GOOGLE_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: node scripts/live-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: |
            artifacts/live
            artifacts/screenshots
          if-no-files-found: ignore
