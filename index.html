<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#04080d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="百眼" />
    <meta name="description" content="百眼：手機優先的 3D 地球情報地圖：雷達、雲圖、颱風、地震、航班、衛星、道路影像、停車與公車即時資訊。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>百眼</title>
  </head>
  <body>
    <main id="app">
      <div id="map" aria-label="3D 地球地圖"></div>
      <div id="fx" class="fx" aria-hidden="true"></div>
      <div id="crosshair" class="crosshair" aria-hidden="true"><span></span></div>

      <header class="top">
        <form id="searchForm" class="search" role="search">
          <span class="search-mark" aria-hidden="true">⌕</span>
          <input id="search" type="search" enterkeyhint="search" placeholder="搜尋地點或貼上地圖連結" aria-label="搜尋地點、地址或座標" autocomplete="off" />
          <button id="searchPaste" type="button" class="ghost paste" aria-label="貼上 Google 地圖分享連結">⧉</button>
          <button id="searchClear" type="button" class="ghost hidden" aria-label="清除搜尋">×</button>
        </form>
        <button id="openSaved" class="round" aria-label="收藏與停車位置">☆</button>
        <button id="openSettings" class="round" aria-label="設定與資料金鑰">⚙</button>
        <div id="searchResults" class="results hidden" role="listbox" aria-label="搜尋結果"></div>
      </header>

      <button id="now" class="now" aria-label="此刻狀態，點開看詳細">
        <span class="now-dot" aria-hidden="true"></span><span id="nowText">取得此刻天氣…</span>
      </button>

      <aside class="side" aria-label="地圖工具">
        <button id="locate" class="tool" aria-label="定位到我的位置"><span aria-hidden="true">◎</span></button>
        <button id="tilt" class="tool" aria-label="切換 3D 視角"><span aria-hidden="true">3D</span></button>
        <button id="north" class="tool" aria-label="指北"><span id="northArrow" aria-hidden="true">▲</span></button>
        <button id="filter" class="tool" aria-label="切換畫面濾鏡"><span aria-hidden="true">◐</span></button>
        <button id="shareView" class="tool" aria-label="分享這個畫面的連結"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="layers" class="tool" aria-label="地圖類型與圖層（可換成 Google 地圖）"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3 2.5 8 12 13l9.5-5L12 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m2.5 12.2 9.5 5 9.5-5M2.5 16.2l9.5 5 9.5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
      </aside>

      <div id="readout" class="readout" aria-hidden="true"></div>
      <section id="targetHud" class="target-hud hidden" aria-live="polite" aria-label="追蹤目標"></section>
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <!-- Ironbow thermal palette: brightness mapped black → purple → red → orange → yellow → white. -->
        <filter id="ironbow" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0" />
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0.02 0.3 0.62 0.86 0.98 1 1" />
            <feFuncG type="table" tableValues="0.01 0.02 0.08 0.3 0.6 0.86 1" />
            <feFuncB type="table" tableValues="0.1 0.45 0.55 0.25 0.06 0.25 0.92" />
          </feComponentTransfer>
        </filter>
      </svg>

      <section id="strip" class="strip hidden" aria-live="polite"></section>

      <nav class="dock" aria-label="視角">
        <button data-lens="weather" aria-pressed="false"><span aria-hidden="true">☂</span>天氣</button>
        <button data-lens="traffic" aria-pressed="false"><span aria-hidden="true">⛟</span>交通</button>
        <button data-lens="parking" aria-pressed="false"><span aria-hidden="true">P</span>停車</button>
        <button data-lens="sky" aria-pressed="false"><span aria-hidden="true">✈</span>天空</button>
        <button data-lens="radio" aria-pressed="false"><span aria-hidden="true">♫</span>電台</button>
      </nav>

      <section id="sheet" class="sheet hidden" role="dialog" aria-modal="false" aria-labelledby="sheetTitle">
        <div class="sheet-grip" aria-hidden="true"></div>
        <header class="sheet-head">
          <div>
            <p id="sheetEyebrow" class="eyebrow"></p>
            <h1 id="sheetTitle"></h1>
          </div>
          <button id="sheetClose" class="ghost close" aria-label="關閉">×</button>
        </header>
        <div id="sheetBody" class="sheet-body"></div>
      </section>

      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
      <div id="update" class="update hidden"><span>新版本已備妥</span><button id="applyUpdate">更新</button></div>
      <noscript><p class="noscript">請啟用 JavaScript 才能使用地圖。</p></noscript>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
